# Mycelium — project memory your agents record as they work.
# Chimaera only READS what mycelium writes (.living/, .mycelium/); installs
# and per-project setup are mycelium's own, run by the agents' own CLIs.
id = "mycelium"
name = "Mycelium"
# The plugin's own version: the crate's (scripts/build-plugins.sh checks).
version = "0.2.1"
summary = "Project memory your agents record as they work — findings, decisions, learnings."
# A few plain sentences for the card, in the plugin author's words.
description = "Mycelium is the Arjun Raj lab's living-repository framework: as agents work they record findings with their evidence, decisions and learnings in the repository's .living/ folder, so the project remembers what was learned and why. This plugin reads those files for the Knowledge view and gives every agent two read tools, knowledge_search and knowledge_get. It never writes."
homepage = "https://github.com/arjunrajlaboratory/mycelium"
# The chimaera:plugin WIT version the component targets.
api = "0.1"

[detect]
any = [".living/INDEX.md", ".living/learnings.md", ".living/findings", "MYCELIUM.md"]

# What it reads through the host: workspace files only. It never reads the
# Timeline or the sessions. Release only once chimaera's plugin trust (which
# reads [access]) is released: an older daemon can't parse this table.
[access]
timeline = "none"
sessions = "none"

[recommends]
# What the agent-side plugin is for, in plain words (shown once above the per-agent state).
summary = "Mycelium's own agent plugin gives claude and codex the skills that record findings, decisions and learnings as they work. Install it for the agents you use; the Knowledge view reads .living/ either way."

[recommends.agent_plugins.claude]
id = "mycelium@mycelium"
marketplace = "arjunrajlaboratory/mycelium"

[recommends.agent_plugins.codex]
id = "mycelium@mycelium"
marketplace = "arjunrajlaboratory/mycelium"

[setup]
# mycelium's own documented default prompt (.codex-plugin/plugin.json).
prompt = "Set up Mycelium in this repository."

[provides]
knowledge = "mycelium"
mcp_tools = ["knowledge_search", "knowledge_get"]

[adds]
ui = ["Fills Knowledge and “Where things stand”; F-, D- and C- ids in chats become links to the entry"]
agents = ["2 read tools for every agent here: knowledge_search · knowledge_get"]

# Where releases of this plugin are published: the daemon offers updates from here.
[release]
github = "martinappberg/chimaera-plugin-mycelium"
